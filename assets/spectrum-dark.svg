<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 222" width="840" height="222" role="img" aria-label="A spectrum of the code in my 76 repositories, one line of light per language, as wide as its share of the bytes: TypeScript 30%, JavaScript 19%, HTML 16%, Python 14%, Zig 13%, PHP 4%, CSS 3%, Shell 0.3%, EJS 0.2%. Around them: Express, Django, PostgreSQL, MongoDB, Docker." font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#9a7bff"/><stop offset="0.22" stop-color="#7cc4ff"/><stop offset="0.45" stop-color="#8df0b4"/><stop offset="0.62" stop-color="#d7f08d"/><stop offset="0.78" stop-color="#ffe08a"/><stop offset="0.9" stop-color="#ffb463"/><stop offset="1" stop-color="#ff8f7a"/></linearGradient>
    <linearGradient id="ends" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="0.09" stop-color="#fff"/><stop offset="0.91" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="tips" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.3" stop-color="#fff"/><stop offset="0.7" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="feather"><rect width="840" height="222" fill="url(#ends)"/></mask>
    <mask id="taper"><rect x="0" y="14" width="840" height="86" fill="url(#tips)"/></mask>
    <filter id="mist" x="-5%" y="-80%" width="110%" height="260%"><feGaussianBlur stdDeviation="14 9"/></filter>
    <filter id="glow" x="-300%" y="-30%" width="700%" height="160%"><feGaussianBlur stdDeviation="7 3"/></filter>
    <filter id="soft" x="-100%" y="-10%" width="300%" height="120%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <clipPath id="plate"><rect width="840" height="222" rx="8"/></clipPath>
  </defs>
  <style>
    .e { animation: shimmer 6s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    @media (prefers-reduced-motion: reduce) { .e { animation: none; } }
  </style>
  <g>
    
    <g mask="url(#feather)">
      <rect x="24" y="34" width="792" height="46" fill="url(#rainbow)" opacity="0.22" filter="url(#mist)"/>
      <g mask="url(#taper)">
      <g class="e" style="animation-delay:0.00s"><rect x="168.9" y="14" width="72" height="86" fill="#7fabdc" opacity="0.5" filter="url(#glow)"/><rect x="196.7" y="14" width="16.4" height="86" rx="3" fill="#b1cce9" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:0.70s"><rect x="625.5" y="14" width="49.3" height="86" fill="#f6ec99" opacity="0.5" filter="url(#glow)"/><rect x="644.5" y="14" width="11.2" height="86" rx="3" fill="#faf3c0" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:1.40s"><rect x="744.2" y="14" width="43.7" height="86" fill="#ee9078" opacity="0.5" filter="url(#glow)"/><rect x="761.1" y="14" width="9.9" height="86" rx="3" fill="#f4bbad" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:2.10s"><rect x="204.7" y="14" width="39.8" height="86" fill="#82a8c7" opacity="0.5" filter="url(#glow)"/><rect x="220.1" y="14" width="9" height="86" rx="3" fill="#b2c9dd" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:2.80s"><rect x="718.7" y="14" width="38.3" height="86" fill="#f3bb9a" opacity="0.5" filter="url(#glow)"/><rect x="733.5" y="14" width="8.7" height="86" rx="3" fill="#f8d5c1" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:3.50s"><rect x="148.8" y="14" width="18.9" height="86" fill="#929bbd" opacity="0.5" filter="url(#glow)"/><rect x="156.1" y="14" width="4.3" height="86" rx="2.1" fill="#bcc1d7" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:4.20s"><rect x="32" y="14" width="16.1" height="86" fill="#a081c0" opacity="0.5" filter="url(#glow)"/><rect x="38.2" y="14" width="3.7" height="86" rx="1.8" fill="#c5b1d8" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:4.90s"><rect x="522.5" y="14" width="11.7" height="86" fill="#b6ec93" opacity="0.5" filter="url(#glow)"/><rect x="527" y="14" width="2.7" height="86" rx="1.3" fill="#d2f3bd" filter="url(#soft)"/></g>
      <g class="e" style="animation-delay:5.60s"><rect x="44.4" y="14" width="11.5" height="86" fill="#ca7493" opacity="0.5" filter="url(#glow)"/><rect x="48.8" y="14" width="2.6" height="86" rx="1.3" fill="#deaabd" filter="url(#soft)"/></g>
      </g>
    </g>
    <g><path d="M204.9 98V132H204.9" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="204.9" y="144" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">TYPESCRIPT 30%</text></g>
    <g><path d="M650.1 98V112H650.1" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="650.1" y="124" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">JAVASCRIPT 19%</text></g>
    <g><path d="M766 98V132H766" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="766" y="144" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">HTML 16%</text></g>
    <g><path d="M224.6 98V112H224.6" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="224.6" y="124" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">PYTHON 14%</text></g>
    <g><path d="M737.8 98V112H737.8" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="737.8" y="124" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">ZIG 13%</text></g>
    <g><path d="M158.2 98V112H158.2" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="158.2" y="124" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">PHP 4%</text></g>
    <g><path d="M40 98V112H42.3" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="42.3" y="124" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">CSS 3%</text></g>
    <g><path d="M528.4 98V112H528.4" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="528.4" y="124" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">SHELL 0.3%</text></g>
    <g><path d="M50.1 98V132H50.1" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><text x="50.1" y="144" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#fff" opacity="0.82">EJS 0.2%</text></g>
    <text x="24" y="180" font-size="11" letter-spacing="2.4" fill="#fff" opacity="0.92">SPECTRUM  ·  UGURCL</text>
    <text x="24" y="196" font-size="9" letter-spacing="0.8" fill="#fff" opacity="0.64">BYTES OF CODE BY LANGUAGE  ·  76 REPOSITORIES  ·  ONE LINE OF LIGHT PER LANGUAGE</text>
    <text x="24" y="211" font-size="9" letter-spacing="0.8" fill="#fff" opacity="0.64">AROUND THEM  ·  EXPRESS  ·  DJANGO  ·  POSTGRESQL  ·  MONGODB  ·  DOCKER</text>
  </g>
</svg>
